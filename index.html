<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Jogo Simples</title><style>body{margin:0;overflow:hidden;background:#87CEEB;}#game{position:relative;width:100vw;height:100vh;}#player{position:absolute;width:50px;height:50px;background:red;bottom:100px;left:100px;border-radius:8px;}#ground{position:absolute;width:100%;height:100px;background:green;bottom:0;}.info{position:absolute;top:10px;left:10px;background:white;padding:10px;border-radius:5px;font-family:Arial;}</style></head><body><div id="game"><div class="info">A/D ou ←/→ = Andar<br>Espaço/W/↑ = Pular</div><div id="player"></div><div id="ground"></div></div><script>const player=document.getElementById('player');let x=100,y=0,velocityY=0,gravity=0.8,jumpForce=15,speed=5,onGround=true;const keys={};document.addEventListener('keydown',e=>keys[e.key]=true);document.addEventListener('keyup',e=>keys[e.key]=false);function gameLoop(){if(keys['a']||keys['A']||keys['ArrowLeft'])x-=speed;if(keys['d']||keys['D']||keys['ArrowRight'])x+=speed;if((keys[' ']||keys['w']||keys['W']||keys['ArrowUp'])&&onGround){velocityY=jumpForce;onGround=false;}velocityY-=gravity;y+=velocityY;if(y<=0){y=0;velocityY=0;onGround=true;}player.style.left=x+'px';player.style.bottom=(100+y)+'px';requestAnimationFrame(gameLoop);}gameLoop();</script></body></html>
